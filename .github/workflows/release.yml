name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package and upstream semantic version, for example 1.3.0'
        required: false
        default: '1.3.0'
      upstream_version:
        description: 'Upstream WiFiman Desktop version to package (defaults to version)'
        required: false
        default: ''
      rpm_release:
        description: 'RPM release number; bump it for packaging-only fixes (tag becomes vVERSION-RELEASE)'
        required: false
        default: '1'
      create_release:
        description: 'Create a GitHub release with downloadable RPM assets'
        required: false
        type: boolean
        default: true
      overwrite:
        description: 'Replace assets on an existing release with the same tag'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tag pushes: vX.Y.Z or vX.Y.Z-N. Manual runs tag vVERSION-RELEASE.
      - name: Resolve release versions
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          INPUT_RPM_RELEASE: ${{ inputs.rpm_release }}
        run: |
          set -euo pipefail
          ./scripts/release-version.sh | tee -a "$GITHUB_ENV"

      - name: Refuse to replace an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release && !inputs.overwrite
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists. Bump rpm_release, or set overwrite=true to replace its assets." >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils python3-yaml

      - name: Run local regression suite
        run: ./tests/run-all.sh

      - name: Build RPM
        run: VERSION="${VERSION}" RELEASE="${RELEASE}" UPSTREAM_VERSION="${UPSTREAM_VERSION}" ./scripts/build-rpm-from-stage.sh

      - name: Collect versioned artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t rpms < <(find .rpmbuild/RPMS .rpmbuild/SRPMS -type f \( -name '*.rpm' -o -name '*.src.rpm' \) | sort)
          if [[ ${#rpms[@]} -eq 0 ]]; then
            echo "No RPM artifacts found" >&2
            exit 1
          fi
          for rpm in "${rpms[@]}"; do
            cp -v "$rpm" "dist/$(basename "$rpm")"
          done
          (cd dist && sha256sum * > "${ASSET_PREFIX}-SHA256SUMS.txt")
          ls -lah dist

      - name: Write release notes
        run: |
          set -euo pipefail
          rpm_name=$(basename "$(find dist -maxdepth 1 -type f -name 'wifiman-desktop-*.x86_64.rpm' | sort | tail -n 1)")
          cat > release-notes.md <<EOF_NOTES
          ## WiFiman Desktop RPM ${VERSION}-${RELEASE}

          Built from upstream WiFiman Desktop **${UPSTREAM_VERSION}**.

          Upstream ${UPSTREAM_VERSION} uses the system WebKitGTK 4.1 / libsoup3 stack, so this RPM no longer bundles a private compatibility runtime.

          The private app root remains \`/usr/lib/wi-fiman-desktop\` for compatibility; public names use \`wifiman-desktop\`. No internal-path migration or clean reinstall is required.

          ### Install on Fedora

          1. Download \`${rpm_name}\` from the assets below.
          2. Install it with DNF:

             \`\`\`bash
             sudo dnf install ./${rpm_name}
             \`\`\`

          3. Launch **WiFiman Desktop** from your applications menu, or run:

             \`\`\`bash
             wifiman-desktop
             \`\`\`

          ### SELinux-enforcing Fedora

          If the daemon is blocked by SELinux denials after install, run the bundled helper from a repo checkout:

          \`\`\`bash
          ./scripts/install-selinux-policy.sh
          \`\`\`

          It installs the repo-managed local SELinux module and any useful recent AVC-derived rules without disabling SELinux enforcement.
          EOF_NOTES
          sed -i 's/^          //' release-notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_PREFIX }}-rpms
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Manual runs create the tag; point it at the commit that was built.
          target_commitish: ${{ github.sha }}
          name: WiFiman Desktop RPM ${{ env.VERSION }}-${{ env.RELEASE }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
