    <circle cx="985" cy="205" r="82" stroke="white" stroke-width="3"/>
    <circle cx="985" cy="205" r="34" fill="white"/>
    <path d="M815 205h340M985 35v340" stroke="white" stroke-width="3"/>
  </g>
  <g filter="url(#shadow)">
