name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package semantic version, for example 1.2.11'
        required: false
        default: '1.2.10'
      upstream_version:
        description: 'Upstream WiFiman Desktop version to package'
        required: false
        default: '1.2.10'
      rpm_release:
        description: 'RPM release number'
        required: false
        default: '1'
      create_release:
        description: 'Create or update a GitHub release with downloadable RPM assets'
        required: false
        type: boolean
        default: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || '1.2.10' }}
      UPSTREAM_VERSION: ${{ inputs.upstream_version || inputs.version || '1.2.10' }}
      RELEASE: ${{ inputs.rpm_release || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "UPSTREAM_VERSION=${version%%-*}" >> "$GITHUB_ENV"

      - name: Validate semantic version
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semantic version style: 1.2.11" >&2
            exit 1
          fi

      - name: Set release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${VERSION}"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "ASSET_PREFIX=wifiman-desktop-${VERSION}-${RELEASE}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils

      - name: Run local regression suite
        run: ./tests/run-all.sh

      - name: Build RPM
        run: VERSION="${VERSION}" RELEASE="${RELEASE}" UPSTREAM_VERSION="${UPSTREAM_VERSION}" ./scripts/build-rpm-from-stage.sh

      - name: Collect versioned artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t rpms < <(find .rpmbuild/RPMS .rpmbuild/SRPMS -type f \( -name '*.rpm' -o -name '*.src.rpm' \) | sort)
          if [[ ${#rpms[@]} -eq 0 ]]; then
            echo "No RPM artifacts found" >&2
            exit 1
          fi
          for rpm in "${rpms[@]}"; do
            cp -v "$rpm" "dist/$(basename "$rpm")"
          done
          (cd dist && sha256sum * > "${ASSET_PREFIX}-SHA256SUMS.txt")
          ls -lah dist

      - name: Write release notes
        run: |
          set -euo pipefail
          rpm_name=$(basename "$(find dist -maxdepth 1 -type f -name 'wifiman-desktop-*.x86_64.rpm' | sort | tail -n 1)")
          cat > release-notes.md <<EOF_NOTES
          ## WiFiman Desktop RPM ${VERSION}-${RELEASE}

          Built from upstream WiFiman Desktop **${UPSTREAM_VERSION}**.

          ### Install on Fedora

          1. Download \`${rpm_name}\` from the assets below.
          2. Install it with DNF:

             \`\`\`bash
             sudo dnf install ./${rpm_name}
             \`\`\`

          3. Launch **WiFiman Desktop** from your applications menu, or run:

             \`\`\`bash
             wifiman-desktop
             \`\`\`

          ### SELinux-enforcing Fedora

          If the daemon is blocked by SELinux denials after install, run the bundled helper from a repo checkout:

          \`\`\`bash
          ./scripts/install-selinux-policy.sh
          \`\`\`

          It installs the repo-managed local SELinux module and any useful recent AVC-derived rules without disabling SELinux enforcement.
          EOF_NOTES
          sed -i 's/^          //' release-notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_PREFIX }}-rpms
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WiFiman Desktop RPM ${{ env.VERSION }}-${{ env.RELEASE }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
