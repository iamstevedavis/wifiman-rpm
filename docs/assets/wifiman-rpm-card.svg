    <path d="M113 158c24-31 54-31 78 0" stroke="#0284C7" stroke-width="15" stroke-linecap="round"/>
    <path d="M139 184c8-10 18-10 26 0" stroke="#0284C7" stroke-width="15" stroke-linecap="round"/>
    <circle cx="152" cy="210" r="10" fill="#0284C7"/>
